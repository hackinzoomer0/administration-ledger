name: Check and deploy
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: python3 scripts/privacy.py --require-config
        env:
          LEDGER_PRIVATE_IDENTIFIERS: ${{ secrets.LEDGER_PRIVATE_IDENTIFIERS }}
      - run: npm ci
      - run: npm run check
      - run: npm run database:validate
      - name: Prepare browser for Playwright
        run: |
          if chrome="$(command -v google-chrome)"; then
            echo "CHROME_PATH=$chrome" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi
      - run: npm run test:e2e
      - run: python3 scripts/privacy.py --require-config --dist dist
        env:
          LEDGER_PRIVATE_IDENTIFIERS: ${{ secrets.LEDGER_PRIVATE_IDENTIFIERS }}
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist
  deploy:
    if: github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
